plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'expo.modules.deckspeech'
version = '0.0.1'

android {
  namespace 'expo.modules.deckspeech'
  defaultConfig {
    minSdk 24
    versionCode 1
    versionName '0.0.1'
  }
}

dependencies {
  compileOnly 'com.facebook.react:react-android'
}
