name: Bug report
description: Report a reproducible problem in the source preview
body:
  - type: markdown
    attributes:
      value: "Remove pairing data, credentials, private paths and owner content before posting. Use private security reporting for vulnerabilities when available."
  - type: textarea
    id: environment
    attributes:
      label: Source, platform and Orca host versions
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Reproduction steps and expected result
    validations:
      required: true
  - type: textarea
    id: observed
    attributes:
      label: Actual observed result and relevant checks
    validations:
      required: true
